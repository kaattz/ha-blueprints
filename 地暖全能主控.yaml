blueprint:
  name: 地暖全能主控
  description: |
    ### 核心逻辑：
    1. **全时段守候**：支持15分钟巡检补救和手动强制运行。
    2. **防抖与保护**：卧室加热时，客厅强制按 [当前室温 + 增温幅度] 陪跑。
    3. **智能归位**：卧室停机后，客厅立即恢复该时段应有的设定温度。
    4. **双重寒潮**：实时+预报双重判定，寒潮锁高水温，暖和切低水温。
    5. **总开关保护**：input_boolean.floorheating_enabled 关闭时，整套蓝图不执行任何动作。
  domain: automation
  input:
    section_devices:
      name: 核心设备与传感器
      icon: mdi:devices
      collapsed: false
      input:
        floorheating_enabled:
          name: 地暖自动主控总开关
          description: 选择 input_boolean.floorheating_enabled；关闭后，本蓝图所有自动控制动作都会跳过。
          selector:
            entity:
              domain: input_boolean
        rinnai_boiler:
          name: 林内锅炉实体 (Climate)
          selector:
            entity:
              domain: climate
        sensor_today_max:
          name: 今日最高气温 (Sensor)
          description: 选择 package 生成的 sensor.today_max_temp
          selector:
            entity:
              domain: sensor
              device_class: temperature
        outdoor_temp_sensor:
          name: 室外实时温度
          selector:
            entity:
              domain: sensor
              device_class: temperature
        climate_living:
          name: 客厅温控器 (主负载/旁通)
          description: 水路最大的房间，用于保证最小流量。
          selector:
            entity:
              domain: climate
        climate_bedrooms:
          name: 卧室温控器 (触发源)
          selector:
            entity:
              domain: climate
              multiple: true
    section_weather_water:
      name: 天气阈值与锅炉水温
      icon: mdi:thermometer-water
      collapsed: true
      input:
        threshold_realtime:
          name: 【实时】寒潮阈值
          default: 5
          selector:
            number:
              min: -10
              max: 15
              step: 1
              unit_of_measurement: °C
        threshold_forecast:
          name: 【预报】寒潮阈值 (最高温)
          default: 12
          selector:
            number:
              min: 0
              max: 25
              step: 1
              unit_of_measurement: °C
        temp_water_cold:
          name: 寒潮模式水温 (高)
          default: 50
          selector:
            number:
              min: 40
              max: 60
              step: 1
              unit_of_measurement: °C
        temp_water_eco:
          name: 节能模式水温 (低)
          default: 40
          selector:
            number:
              min: 35
              max: 50
              step: 1
              unit_of_measurement: °C
    section_room_temps:
      name: 室内目标温度设置
      icon: mdi:home-thermometer
      collapsed: true
      input:
        temp_comfort:
          name: 舒适温度
          default: 22.5
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: °C
        temp_solar_save:
          name: 节能温度 (白天)
          default: 19
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: °C
        temp_sleep:
          name: 睡眠温度 (深夜)
          default: 20.5
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: °C
    section_protection:
      name: 高级保护 (防启停)
      icon: mdi:shield-check
      collapsed: true
      input:
        temp_companion_delta:
          name: 陪跑增温幅度
          description: 卧室在真实加热(heating)时，客厅目标温度 = 当前室温 + 此数值
          default: 2
          selector:
            number:
              min: 0.5
              max: 5
              step: 0.5
              unit_of_measurement: °C
        companion_deadband:
          name: 陪跑死区 (防来回跳)
          description: 客厅目标温度超过“陪跑目标 - 死区”时不再重复下发
          default: 0.5
          selector:
            number:
              min: 0.2
              max: 2
              step: 0.1
              unit_of_measurement: °C
        allow_companion_at_night:
          name: 深夜允许陪跑
          default: false
          selector:
            boolean: null
    section_schedule:
      name: 时间日程设置
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_morning:
          name: 早晨舒适开始时间
          default: 06:00:00
          selector:
            time: null
        time_day:
          name: 白天模式开始时间
          default: 09:00:00
          selector:
            time: null
        time_evening:
          name: 晚间舒适开始时间
          default: '17:00:00'
          selector:
            time: null
        time_night:
          name: 深夜睡眠开始时间
          default: '23:00:00'
          selector:
            time: null
    section_helpers:
      name: 锁定与延时 (必配)
      icon: mdi:timer-lock
      collapsed: true
      input:
        water_last_change:
          name: 水温最后一次切换时间 (input_datetime)
          description: 需要你新建一个 input_datetime（日期+时间）
          selector:
            entity:
              domain: input_datetime
        water_change_lock_minutes:
          name: 水温切换锁定分钟数
          default: 30
          selector:
            number:
              min: 5
              max: 180
              step: 5
              unit_of_measurement: min
        boiler_off_delay_minutes:
          name: 全部房间 off 后，锅炉延时关机分钟数
          default: 20
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
  source_url: https://github.com/kaattz/ha-blueprints/blob/main/%E5%9C%B0%E6%9A%96%E5%85%A8%E8%83%BD%E4%B8%BB%E6%8E%A7.yaml
mode: restart
trigger_variables:
  trig_living: !input 'climate_living'
  trig_bedrooms: !input 'climate_bedrooms'
variables:
  floorheating_enabled: !input 'floorheating_enabled'
  living_cl: !input 'climate_living'
  bedrooms_cl: !input 'climate_bedrooms'
  outdoor_sensor: !input 'outdoor_temp_sensor'
  today_max_sensor: !input 'sensor_today_max'
  boiler: !input 'rinnai_boiler'
  limit_real: !input 'threshold_realtime'
  limit_day: !input 'threshold_forecast'
  water_high: !input 'temp_water_cold'
  water_low: !input 'temp_water_eco'
  t_comfort: !input 'temp_comfort'
  t_solar: !input 'temp_solar_save'
  t_sleep: !input 'temp_sleep'
  temp_plus: !input 'temp_companion_delta'
  companion_db: !input 'companion_deadband'
  allow_night_companion: !input 'allow_companion_at_night'
  t_m: !input 'time_morning'
  t_d: !input 'time_day'
  t_e: !input 'time_evening'
  t_n: !input 'time_night'
  water_last_dt: !input 'water_last_change'
  water_lock_min: !input 'water_change_lock_minutes'
  is_cold: |
    {% set current = states(outdoor_sensor) | float(10) %} {% set today_max = states(today_max_sensor) | float(10) %} {% set lim_r = limit_real | float %} {% set lim_d = limit_day | float %} {{ current < lim_r or today_max < lim_d }}
  schedule_target_temp: |
    {% if is_cold %}
      {{ t_comfort | float }}
    {% else %}
      {% set now_s = now().strftime('%H:%M:%S') %}
      {% set s_m = t_m | string %}
      {% set s_d = t_d | string %}
      {% set s_e = t_e | string %}
      {% set s_n = t_n | string %}

      {% if now_s >= s_n or now_s < s_m %}
        {{ t_sleep | float }}
      {% elif now_s >= s_d and now_s < s_e %}
        {{ t_solar | float }}
      {% else %}
        {{ t_comfort | float }}
      {% endif %}
    {% endif %}
  desired_water_temp: |
    {{ (water_high if is_cold else water_low) | float }}
  bedrooms_heating_count: |
    {{
      expand(bedrooms_cl)
      | selectattr('state','eq','heat')
      | selectattr('attributes.hvac_action','defined')
      | selectattr('attributes.hvac_action','eq','heating')
      | list | count
    }}
  any_room_heat_mode_count: |
    {{
      expand(bedrooms_cl, living_cl)
      | selectattr('state','eq','heat')
      | list | count
    }}
trigger:
- platform: state
  entity_id: !input 'floorheating_enabled'
  to: 'on'
  id: enabled_on
- platform: time
  at: !input 'time_morning'
  id: schedule_apply
- platform: time
  at: !input 'time_day'
  id: schedule_apply
- platform: time
  at: !input 'time_evening'
  id: schedule_apply
- platform: time
  at: !input 'time_night'
  id: schedule_apply
- platform: state
  entity_id: !input 'climate_living'
  to:
  - heat
  - 'off'
  id: room_mode_change
- platform: state
  entity_id: !input 'climate_bedrooms'
  to:
  - heat
  - 'off'
  id: room_mode_change
- platform: state
  entity_id:
  - !input 'outdoor_temp_sensor'
  - !input 'sensor_today_max'
  id: weather_change
- platform: template
  value_template: |
    {{
      expand(trig_living, trig_bedrooms)
      | selectattr('state','eq','heat')
      | list | count == 0
    }}
  for:
    minutes: !input 'boiler_off_delay_minutes'
  id: boiler_delayed_off
- platform: time_pattern
  minutes: /15
  id: periodic_check
action:
- condition: template
  value_template: '{{ is_state(floorheating_enabled, ''on'') }}'
- choose:
  - conditions:
    - condition: or
      conditions:
      - condition: trigger
        id: schedule_apply
      - condition: trigger
        id: periodic_check
      - condition: trigger
        id: enabled_on
      - condition: template
        value_template: '{{ trigger.id is undefined }}'
    sequence:
    - repeat:
        for_each: !input 'climate_bedrooms'
        sequence:
        - if:
          - condition: template
            value_template: |
              {{ state_attr(repeat.item, 'temperature') | float(0) != schedule_target_temp | float }}
          then:
          - service: climate.set_temperature
            target:
              entity_id: '{{ repeat.item }}'
            data:
              hvac_mode: heat
              temperature: '{{ schedule_target_temp }}'
    - if:
      - condition: template
        value_template: '{{ bedrooms_heating_count | int(0) == 0 }}'
      - condition: template
        value_template: |
          {{ state_attr(living_cl, 'temperature') | float(0) != schedule_target_temp | float }}
      then:
      - service: climate.set_temperature
        target:
          entity_id: !input 'climate_living'
        data:
          hvac_mode: heat
          temperature: '{{ schedule_target_temp }}'
  - conditions:
    - condition: template
      value_template: '{{ bedrooms_heating_count | int(0) > 0 }}'
    - condition: template
      value_template: |
        {% set now_s = now().strftime('%H:%M:%S') %} {% set s_m = t_m | string %} {% set s_n = t_n | string %} {% set is_night = (now_s >= s_n or now_s < s_m) %} {{ (not is_night) or (is_night and (allow_night_companion | bool)) }}
    sequence:
    - variables:
        companion_target: |
          {{
            [
              (state_attr(living_cl,'current_temperature') | float(20) + temp_plus | float),
              (t_comfort | float + 2.5)
            ] | min
          }}
        living_set: '{{ state_attr(living_cl,''temperature'') | float(0) }}'
    - if:
      - condition: template
        value_template: |
          {{ (not is_state(living_cl,'heat'))
             or (living_set < (companion_target - (companion_db | float))) }}
      then:
      - service: climate.set_temperature
        target:
          entity_id: !input 'climate_living'
        data:
          hvac_mode: heat
          temperature: '{{ companion_target }}'
  - conditions:
    - condition: template
      value_template: '{{ bedrooms_heating_count | int(0) == 0 }}'
    sequence:
    - variables:
        living_set: '{{ state_attr(living_cl,''temperature'') | float(0) }}'
        target: '{{ schedule_target_temp | float }}'
    - if:
      - condition: template
        value_template: '{{ living_set > (target + 0.3) }}'
      then:
      - service: climate.set_temperature
        target:
          entity_id: !input 'climate_living'
        data:
          hvac_mode: heat
          temperature: '{{ schedule_target_temp }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ any_room_heat_mode_count | int(0) > 0 }}'
    - condition: not
      conditions:
      - condition: state
        entity_id: !input 'rinnai_boiler'
        state: heat
    sequence:
    - service: climate.set_hvac_mode
      target:
        entity_id: !input 'rinnai_boiler'
      data:
        hvac_mode: heat
  - conditions:
    - condition: trigger
      id: boiler_delayed_off
    - condition: template
      value_template: '{{ any_room_heat_mode_count | int(0) == 0 }}'
    sequence:
    - service: climate.set_hvac_mode
      target:
        entity_id: !input 'rinnai_boiler'
      data:
        hvac_mode: 'off'
- if:
  - condition: state
    entity_id: !input 'rinnai_boiler'
    state: heat
  then:
  - variables:
      last_s: '{{ states(water_last_dt) }}'
      lock_ok: |
        {% set t_last = as_timestamp(last_s, default=None) %}
        {% if t_last is none %}
          true
        {% else %}
          {{ (as_timestamp(now()) - t_last) > ((water_lock_min | float) * 60) }}
        {% endif %}
      boiler_set: '{{ state_attr(boiler,''temperature'') | float(0) }}'
      desired: '{{ desired_water_temp | float }}'
  - if:
    - condition: template
      value_template: '{{ lock_ok and (boiler_set | float(0) != desired | float) }}'
    then:
    - service: climate.set_temperature
      target:
        entity_id: !input 'rinnai_boiler'
      data:
        hvac_mode: heat
        temperature: '{{ desired }}'
    - service: input_datetime.set_datetime
      target:
        entity_id: !input 'water_last_change'
      data:
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
