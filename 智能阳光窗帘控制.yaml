blueprint:
  name: 智能阳光窗帘控制
  description: |
    基于太阳方位、高度角、现场光照强度及人体存在的自动窗帘控制。

    关闭条件：
    - 太阳方位角进入窗户范围
    - 太阳高度角高于动态最低阈值
    - 太阳高度角低于动态最高阈值
    - 光照高于阈值

    打开条件：
    - 关闭条件不再满足
    - 光照已经低于阈值
    - 持续达到无阳光等待时间
    - 如果配置了人体存在传感器，还必须无人达到等待时间

    房间无人补关：
    - 配置人体存在传感器后，房间无人达到等待时间且阳光关闭条件仍成立时，自动关闭窗帘。
    - 用于人工开帘后人员离开房间的场景；人在房间内时不会被自动抢回控制权。

    说明：
    - 朝南窗户夏天容易出现“太阳高度角很高，但室内没有直射”的情况。
    - 因此增加了太阳高度角上限，避免夏季南窗误关。
    - 南向窗建议：
      window_azimuth: 189
      azimuth_range: 55
      min_elevation_winter: 3
      min_elevation_summer: 25
      max_elevation_winter: 90
      max_elevation_summer: 55
      lux_threshold: 4000
      no_sun_duration: 10
      no_presence_duration: 30

  domain: automation
  source_url: https://github.com/kaattz/ha-blueprints/blob/main/%E6%99%BA%E8%83%BD%E9%98%B3%E5%85%89%E7%AA%97%E5%B8%98%E6%8E%A7%E5%88%B6.yaml

  input:
    target_curtains:
      name: 目标窗帘
      selector:
        target:
          entity:
          - domain:
            - cover
    presence_sensor:
      name: 人体存在传感器（可选）
      default: ''
      selector:
        entity:
          domain:
          - binary_sensor
          reorder: false
          multiple: false
    lux_sensor:
      name: 光照传感器（Lux）
      description: 务必准确反映窗边亮度。
      selector:
        entity:
          domain:
          - sensor
          device_class:
          - illuminance
          reorder: false
          multiple: false
    weather_entity:
      name: 天气实体
      description: 仅保留用于诊断，不参与关帘判定。
      selector:
        entity:
          domain:
          - weather
          reorder: false
          multiple: false
    window_azimuth:
      name: 窗户方位角
      description: 北=0，东=90，南=180，西=270。
      default: 180
      selector:
        number:
          min: 0
          max: 360
          mode: box
          step: 1
    azimuth_range:
      name: 方位角范围（+/-）
      description: 南窗建议 50-70；西窗可适当大一点。
      default: 60
      selector:
        number:
          min: 0
          max: 120
          mode: box
          step: 1
    min_elevation_winter:
      name: 冬至最低高度角（12月22日）
      description: 一年中太阳最低时使用的最低高度角阈值。
      default: 3
      selector:
        number:
          min: 0
          max: 90
          mode: slider
          step: 1
    min_elevation_summer:
      name: 夏至最低高度角（6月21日）
      description: 一年中太阳最高时使用的最低高度角阈值。
      default: 25
      selector:
        number:
          min: 0
          max: 90
          mode: slider
          step: 1
    max_elevation_winter:
      name: 冬季最高高度角
      description: 冬天太阳较低，通常可以设高一些，例如 90。
      default: 90
      selector:
        number:
          min: 0
          max: 90
          mode: slider
          step: 1
    max_elevation_summer:
      name: 夏季最高高度角
      description: 夏天太阳太高时，朝南窗通常不会有直射，可设为 50-60。
      default: 55
      selector:
        number:
          min: 0
          max: 90
          mode: slider
          step: 1
    lux_threshold:
      name: 光照触发阈值
      description: 未配置动态阈值助手或助手状态无效时使用。
      default: 4000
      selector:
        number:
          min: 0
          max: 100000
          mode: box
          step: 1
    lux_threshold_helper:
      name: 自动学习照度阈值助手（可选）
      description: 配置后优先读取该 input_number；无效时回退到固定光照触发阈值。
      default: ''
      selector:
        entity:
          domain:
          - input_number
          reorder: false
          multiple: false
    no_sun_duration:
      name: 无阳光等待时间（分钟）
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: minutes
          step: 1
          mode: slider
    no_presence_duration:
      name: 无人等待时间（分钟）
      default: 30
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: minutes
          step: 1
          mode: slider
    automation_switch:
      name: 自动化总开关（可选）
      default: ''
      selector:
        entity:
          domain:
          - input_boolean
          reorder: false
          multiple: false
mode: restart
max_exceeded: silent

trigger_variables:
  lux_sensor_entity: !input lux_sensor
  win_az: !input window_azimuth
  az_range: !input azimuth_range
  limit_winter: !input min_elevation_winter
  limit_summer: !input min_elevation_summer
  max_limit_winter: !input max_elevation_winter
  max_limit_summer: !input max_elevation_summer
  lux_limit: !input lux_threshold
  lux_threshold_helper_entity: !input lux_threshold_helper
  presence_entity: !input presence_sensor

variables:
  lux_sensor_entity: !input lux_sensor
  win_az: !input window_azimuth
  az_range: !input azimuth_range
  limit_winter: !input min_elevation_winter
  limit_summer: !input min_elevation_summer
  max_limit_winter: !input max_elevation_winter
  max_limit_summer: !input max_elevation_summer
  lux_limit: !input lux_threshold
  lux_threshold_helper_entity: !input lux_threshold_helper
  effective_lux_limit: >
    {% set helper_raw = states(lux_threshold_helper_entity) if lux_threshold_helper_entity not in [none, '', []] else '' %}
    {% set helper_lux = helper_raw | float(0) %}
    {{ helper_lux if helper_raw not in ['unknown', 'unavailable', 'none', ''] and is_number(helper_raw) and 1000 <= helper_lux <= 50000 else (lux_limit | float(0)) }}
  lux_limit_source: >
    {% set helper_raw = states(lux_threshold_helper_entity) if lux_threshold_helper_entity not in [none, '', []] else '' %}
    {% set helper_lux = helper_raw | float(0) %}
    {{ 'helper' if helper_raw not in ['unknown', 'unavailable', 'none', ''] and is_number(helper_raw) and 1000 <= helper_lux <= 50000 else 'fixed_fallback' }}
  presence_entity: !input presence_sensor
  no_presence_mins: !input no_presence_duration
  auto_switch_entity: !input automation_switch

trigger:
  - platform: template
    id: sun_arrived
    value_template: >
      {% set day = now().strftime('%j') | int %}
      {% set rad = (day + 10) * 2 * 3.1415926 / 365 %}
      {% set factor = (1 - cos(rad)) / 2 %}

      {% set winter = limit_winter | float(0) %}
      {% set summer = limit_summer | float(0) %}
      {% set dynamic_min = winter + (summer - winter) * factor %}

      {% set max_winter = max_limit_winter | float(90) %}
      {% set max_summer = max_limit_summer | float(55) %}
      {% set dynamic_max = max_winter + (max_summer - max_winter) * factor %}

      {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
      {% set el = state_attr('sun.sun', 'elevation') | float(0) %}
      {% set az_diff = ((az - (win_az | float(0)) + 540) % 360) - 180 %}
      {% set sun_hits_window = (az_diff | abs) <= (az_range | float(0)) %}

      {% set lux_raw = states(lux_sensor_entity) %}
      {% set lux_valid = lux_raw not in ['unknown', 'unavailable', 'none', ''] %}
      {% set lux = lux_raw | float(0) %}
      {% set helper_raw = states(lux_threshold_helper_entity) if lux_threshold_helper_entity not in [none, '', []] else '' %}
      {% set helper_lux = helper_raw | float(0) %}
      {% set helper_valid = helper_raw not in ['unknown', 'unavailable', 'none', ''] and is_number(helper_raw) and 1000 <= helper_lux <= 50000 %}
      {% set effective_lux_limit = helper_lux if helper_valid else (lux_limit | float(0)) %}

      {{
        lux_valid
        and sun_hits_window
        and el > dynamic_min
        and el < dynamic_max
        and lux > effective_lux_limit
      }}

  - platform: template
    id: sun_gone_wait
    value_template: >
      {% set day = now().strftime('%j') | int %}
      {% set rad = (day + 10) * 2 * 3.1415926 / 365 %}
      {% set factor = (1 - cos(rad)) / 2 %}

      {% set winter = limit_winter | float(0) %}
      {% set summer = limit_summer | float(0) %}
      {% set dynamic_min = winter + (summer - winter) * factor %}

      {% set max_winter = max_limit_winter | float(90) %}
      {% set max_summer = max_limit_summer | float(55) %}
      {% set dynamic_max = max_winter + (max_summer - max_winter) * factor %}

      {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
      {% set el = state_attr('sun.sun', 'elevation') | float(0) %}
      {% set az_diff = ((az - (win_az | float(0)) + 540) % 360) - 180 %}
      {% set sun_hits_window = (az_diff | abs) <= (az_range | float(0)) %}

      {% set lux_raw = states(lux_sensor_entity) %}
      {% set lux_valid = lux_raw not in ['unknown', 'unavailable', 'none', ''] %}
      {% set lux = lux_raw | float(0) %}
      {% set helper_raw = states(lux_threshold_helper_entity) if lux_threshold_helper_entity not in [none, '', []] else '' %}
      {% set helper_lux = helper_raw | float(0) %}
      {% set helper_valid = helper_raw not in ['unknown', 'unavailable', 'none', ''] and is_number(helper_raw) and 1000 <= helper_lux <= 50000 %}
      {% set effective_lux_limit = helper_lux if helper_valid else (lux_limit | float(0)) %}

      {% set close_condition =
        lux_valid
        and sun_hits_window
        and el > dynamic_min
        and el < dynamic_max
        and lux > effective_lux_limit
      %}

      {{ lux_valid and lux < effective_lux_limit and not close_condition }}
    for:
      minutes: !input no_sun_duration

  - platform: template
    id: person_gone_wait
    value_template: >
      {% if presence_entity in [none, '', []] %}
        false
      {% else %}
        {{ is_state(presence_entity, 'off') }}
      {% endif %}
    for:
      minutes: !input no_presence_duration

condition:
  - condition: sun
    after: sunrise
    before: sunset

  - condition: template
    value_template: >
      {% if auto_switch_entity in [none, '', []] %}
        true
      {% else %}
        {{ is_state(auto_switch_entity, 'on') }}
      {% endif %}

action:
  - choose:
      - conditions:
          - condition: trigger
            id: sun_arrived
        sequence:
          - action: cover.close_cover
            target: !input target_curtains

      - conditions:
          - condition: trigger
            id: person_gone_wait
          - condition: template
            value_template: >
              {% set day = now().strftime('%j') | int %}
              {% set rad = (day + 10) * 2 * 3.1415926 / 365 %}
              {% set factor = (1 - cos(rad)) / 2 %}

              {% set winter = limit_winter | float(0) %}
              {% set summer = limit_summer | float(0) %}
              {% set dynamic_min = winter + (summer - winter) * factor %}

              {% set max_winter = max_limit_winter | float(90) %}
              {% set max_summer = max_limit_summer | float(55) %}
              {% set dynamic_max = max_winter + (max_summer - max_winter) * factor %}

              {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
              {% set el = state_attr('sun.sun', 'elevation') | float(0) %}
              {% set az_diff = ((az - (win_az | float(0)) + 540) % 360) - 180 %}
              {% set sun_hits_window = (az_diff | abs) <= (az_range | float(0)) %}

              {% set lux_raw = states(lux_sensor_entity) %}
              {% set lux_valid = lux_raw not in ['unknown', 'unavailable', 'none', ''] %}
              {% set lux = lux_raw | float(0) %}
              {% set helper_raw = states(lux_threshold_helper_entity) if lux_threshold_helper_entity not in [none, '', []] else '' %}
              {% set helper_lux = helper_raw | float(0) %}
              {% set helper_valid = helper_raw not in ['unknown', 'unavailable', 'none', ''] and is_number(helper_raw) and 1000 <= helper_lux <= 50000 %}
              {% set effective_lux_limit = helper_lux if helper_valid else (lux_limit | float(0)) %}

              {{
                lux_valid
                and sun_hits_window
                and el > dynamic_min
                and el < dynamic_max
                and lux > effective_lux_limit
              }}
        sequence:
          - action: cover.close_cover
            target: !input target_curtains

    default:
      - condition: template
        value_template: >
          {% set day = now().strftime('%j') | int %}
          {% set rad = (day + 10) * 2 * 3.1415926 / 365 %}
          {% set factor = (1 - cos(rad)) / 2 %}

          {% set winter = limit_winter | float(0) %}
          {% set summer = limit_summer | float(0) %}
          {% set dynamic_min = winter + (summer - winter) * factor %}

          {% set max_winter = max_limit_winter | float(90) %}
          {% set max_summer = max_limit_summer | float(55) %}
          {% set dynamic_max = max_winter + (max_summer - max_winter) * factor %}

          {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
          {% set el = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set az_diff = ((az - (win_az | float(0)) + 540) % 360) - 180 %}
          {% set sun_hits_window = (az_diff | abs) <= (az_range | float(0)) %}

          {% set lux_raw = states(lux_sensor_entity) %}
          {% set lux_valid = lux_raw not in ['unknown', 'unavailable', 'none', ''] %}
          {% set lux = lux_raw | float(0) %}
          {% set helper_raw = states(lux_threshold_helper_entity) if lux_threshold_helper_entity not in [none, '', []] else '' %}
          {% set helper_lux = helper_raw | float(0) %}
          {% set helper_valid = helper_raw not in ['unknown', 'unavailable', 'none', ''] and is_number(helper_raw) and 1000 <= helper_lux <= 50000 %}
          {% set effective_lux_limit = helper_lux if helper_valid else (lux_limit | float(0)) %}

          {% set close_condition =
            lux_valid
            and sun_hits_window
            and el > dynamic_min
            and el < dynamic_max
            and lux > effective_lux_limit
          %}

          {{ lux_valid and lux < effective_lux_limit and not close_condition }}

      - condition: template
        value_template: >
          {% if presence_entity in [none, '', []] %}
            true
          {% elif is_state(presence_entity, 'off') %}
            {% set last_changed = states[presence_entity].last_changed %}
            {% set duration_sec = (no_presence_mins | float(0)) * 60 %}
            {% set time_diff = as_timestamp(now()) - as_timestamp(last_changed) %}
            {{ time_diff >= duration_sec }}
          {% else %}
            false
          {% endif %}

      - action: cover.open_cover
        target: !input target_curtains
