blueprint:
  name: 无线窗帘电动窗单键循环控制
  description: |
    实现“单键控制窗帘循环 (开 -> 停 -> 关 -> 停)”，支持多种触发方式混用。

    ### ✨ 功能亮点
    1. **智能循环**：按键触发时，自动判断是“停止”还是“反向动作”。
    2. **状态追踪**：自动监听系统指令，计算剩余时间，确保“正在运行”状态准确。
    3. **设备支持**：
       *   **KNX/普通面板** (Device触发器，需选组地址)
       *   **领普/米家遥控** (Event实体，需校验按键ID)
       *   **宜家/Z2M遥控** (Device触发器，需校验Payload)
  domain: automation
  input:
    target_cover:
      name: 目标窗帘
      selector:
        entity:
          domain: cover
    time_helper:
      name: 结束时间辅助实体（input_datetime）
      selector:
        entity:
          domain: input_datetime
    last_action_helper:
      name: 上次动作记录（open / close）
      selector:
        entity:
          domain: input_select
    total_duration:
      name: 全程运行时间（秒）
      default: 45
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
    knx_group_addresses:
      name: KNX Group Address 列表
      description: |
        示例：[1/1/1, 1/1/2]
      default: []
      selector:
        object: null
    linp_event_entity:
      name: 领普/米家事件实体（event.xxx，可留空）
      default: ''
      selector:
        entity:
          domain: event
    linp_button_number:
      name: 领普通按键编号（1=左，2=上，3=右，4=下）
      default: 1
      selector:
        number:
          min: 1
          max: 4
          step: 1
    generic_event_entity:
      name: 通用单键事件（event.xxx，可留空）
      default: ''
      selector:
        entity:
          domain: event
    z2m_device:
      name: Z2M / IKEA 遥控器设备（可留空）
      default: ''
      selector:
        device: {}
    z2m_action:
      name: Z2M 动作名
      default: toggle
      selector:
        text: {}
  source_url: https://github.com/kaattz/ha-blueprints/blob/main/%E6%97%A0%E7%BA%BF%E7%AA%97%E5%B8%98%E7%94%B5%E5%8A%A8%E7%AA%97%E5%8D%95%E9%94%AE%E5%BE%AA%E7%8E%AF%E6%8E%A7%E5%88%B6.yaml
mode: parallel
max: 10
trigger:
- platform: event
  event_type: knx_event
  id: knx
- platform: event
  event_type: state_changed
  id: event_entity_trigger
- platform: event
  event_type: zha_event
  id: z2m_zha
- platform: event
  event_type: deconz_event
  id: z2m_deconz
- platform: event
  event_type: mqtt
  id: z2m_mqtt
- platform: event
  event_type: call_service
  event_data:
    domain: cover
  id: service_call
variables:
  cover_entity: !input 'target_cover'
  time_end: !input 'time_helper'
  last_action: !input 'last_action_helper'
  total_time: !input 'total_duration'
  knx_addrs: !input 'knx_group_addresses'
  linp_entity: !input 'linp_event_entity'
  linp_btn: !input 'linp_button_number'
  generic_event: !input 'generic_event_entity'
  z2m_dev: !input 'z2m_device'
  z2m_cmd: !input 'z2m_action'
condition:
- condition: template
  value_template: "{% set id = trigger.id %}\n\n{# ========== ① KNX ========== #}\n{% if id == 'knx' %}\n  {% if (knx_addrs\
    \ is not iterable) or (knx_addrs | length == 0) %}\n    false\n  {% else %}\n    {% set dest = (trigger.event.data.destination\
    \ | string) %}\n    {% set ttype = trigger.event.data.telegramtype | string %}\n    {% set base = dest.split('/')[:2]\
    \ | join('/') ~ '/*' %}\n    {{ ttype == 'GroupValueWrite'\n       and (\n         dest in knx_addrs\n         or base\
    \ in knx_addrs\n       )\n    }}\n  {% endif %}\n\n{# ========== ② Event 实体 (领普 OR 通用) 【修复重点】 ========== #}\n{% elif id\
    \ == 'event_entity_trigger' %}\n  {% set e = trigger.event.data %}\n  {% set ent = e.entity_id | string %}\n  \n  {# 1.\
    \ 优先过滤：必须是配置的实体之一，否则直接跳过，防止读取属性报错 #}\n  {% if ent not in [linp_entity, generic_event] %}\n    false\n  \n  {# 2. 如果是空配置，也跳过\
    \ #}\n  {% elif ent == '' %}\n    false\n  \n  {% else %}\n    {% set new = e.new_state %}\n    \n    {# 3. 安全读取属性：使用\
    \ .get() 方法 #}\n    {% if new is none %}\n      false\n    {% else %}\n       {# 获取 event_type，默认为空字符串 #}\n       {% set\
    \ evt_type = new.attributes.get('event_type', '') | string %}\n       \n       {% if evt_type != '单击' %}\n         false\n\
    \       \n       {# 4. 领普实体特判：按键类型 #}\n       {% elif linp_entity != '' and ent == linp_entity %}\n         {{ (new.attributes.get('按键类型',\
    \ 0) | int(0)) == linp_btn }}\n       \n       {# 5. 通用实体：只要是单击就通过 #}\n       {% else %}\n         true\n       {% endif\
    \ %}\n    {% endif %}\n  {% endif %}\n\n{# ========== ③ Z2M / IKEA ========== #}\n{% elif id in ['z2m_zha', 'z2m_deconz',\
    \ 'z2m_mqtt'] %}\n  {% if z2m_dev == '' %}\n    false\n  {% else %}\n    {% set d = trigger.event.data %}\n    {% set\
    \ dev_id = d.device_id | default('') %}\n    {% set cmd = d.command | default(d.payload | default(d.event | default('')))\
    \ %}\n    {{ dev_id == z2m_dev and cmd == z2m_cmd }}\n  {% endif %}\n\n{# ========== ④ cover service 追踪 ========== #}\n\
    {% elif id == 'service_call' %}\n  {% set sdata = trigger.event.data.service_data %}\n  {% set ent = sdata.entity_id %}\n\
    \  {% if ent is string %}\n    {{ ent == cover_entity }}\n  {% elif ent is iterable %}\n    {{ cover_entity in ent }}\n\
    \  {% else %}\n    false\n  {% endif %}\n\n{% else %}\n  false\n{% endif %}\n"
action:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ trigger.id == ''service_call'' }}'
    sequence:
    - variables:
        pos: '{{ state_attr(cover_entity, ''current_position'') | float(0) }}'
        direction: '{{ ''open'' if trigger.event.data.service == ''open_cover'' else ''close'' }}'
        remain_pct: '{{ 100 - pos if direction == ''open'' else pos }}'
        remain_sec: '{{ (remain_pct / 100.0) * total_time }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ trigger.event.data.service in [''open_cover'', ''close_cover''] }}'
        sequence:
        - action: input_datetime.set_datetime
          target:
            entity_id: '{{ time_end }}'
          data:
            datetime: |
              {{ (now() + timedelta(seconds=remain_sec))
                 .strftime('%Y-%m-%d %H:%M:%S') }}
        - action: input_select.select_option
          target:
            entity_id: '{{ last_action }}'
          data:
            option: '{{ direction }}'
      - conditions:
        - condition: template
          value_template: '{{ trigger.event.data.service == ''stop_cover'' }}'
        sequence:
        - action: input_datetime.set_datetime
          target:
            entity_id: '{{ time_end }}'
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  default:
  - variables:
      moving_end: '{{ states(time_end) }}'
      is_moving: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') < moving_end }}'
      cover_position: '{{ state_attr(cover_entity, ''current_position'') | float(-1) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_moving }}'
      sequence:
      - action: cover.stop_cover
        target:
          entity_id: '{{ cover_entity }}'
    - conditions:
      - condition: template
        value_template: '{{ not is_moving }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ cover_position | float(-1) >= 99 }}'
          sequence:
          - action: cover.close_cover
            target:
              entity_id: '{{ cover_entity }}'
        - conditions:
          - condition: template
            value_template: |
              {{ cover_position | float(-1) >= 0
                 and cover_position | float(-1) <= 1 }}
          sequence:
          - action: cover.open_cover
            target:
              entity_id: '{{ cover_entity }}'
        - conditions:
          - condition: template
            value_template: '{{ is_state(last_action, ''open'') }}'
          sequence:
          - action: cover.close_cover
            target:
              entity_id: '{{ cover_entity }}'
        - conditions:
          - condition: template
            value_template: '{{ is_state(last_action, ''close'') }}'
          sequence:
          - action: cover.open_cover
            target:
              entity_id: '{{ cover_entity }}'
        default:
        - action: cover.open_cover
          target:
            entity_id: '{{ cover_entity }}'
