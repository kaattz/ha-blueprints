blueprint:
  name: 场景模式选择器 (8路回弹·容错版)
  description: |
    ### 功能
    关联 `Input Select` 与 `Script`，执行后自动重置。

    ### 核心特性
    1. **自动回弹**：执行脚本后，下拉框自动跳回“复位选项”，解决无法重复点击同一模式的问题。
    2. **智能容错**：自动忽略输入名称前后的空格（防止手误）。
    3. **灵活配置**：支持最多 8 个场景，未填写的选项会自动忽略。

    ### ⚠️ 使用前必读
    请务必在 `input_select` 实体中添加一个用于显示的**空选项**（建议命名为 `...` 或 `≡ 请选择`），并将其填入下方的“复位/默认选项名称”中。
  domain: automation
  input:
    select_entity:
      name: 场景选择器 (Input Select)
      description: 选择你的 input_select 实体。
      selector:
        entity:
          domain: input_select
    
    reset_option:
      name: 复位/默认选项名称
      description: 执行完毕后自动跳回的选项 (如 "请选择" )。必须与 input_select 中的选项完全一致。
      default: 请选择
      selector:
        text: {}

    # --- 场景配置区域 (最多8个) ---
    scene_option_1:
      name: 场景 1 名称
      description: 对应下拉框中的选项名称。
      default: ""
      selector:
        text: {}
    script_1:
      name: 场景 1 执行脚本
      default: []
      selector:
        entity:
          domain: script

    scene_option_2:
      name: 场景 2 名称
      default: ""
      selector:
        text: {}
    script_2:
      name: 场景 2 执行脚本
      default: []
      selector:
        entity:
          domain: script

    scene_option_3:
      name: 场景 3 名称
      default: ""
      selector:
        text: {}
    script_3:
      name: 场景 3 执行脚本
      default: []
      selector:
        entity:
          domain: script

    scene_option_4:
      name: 场景 4 名称
      default: ""
      selector:
        text: {}
    script_4:
      name: 场景 4 执行脚本
      default: []
      selector:
        entity:
          domain: script

    scene_option_5:
      name: 场景 5 名称
      default: ""
      selector:
        text: {}
    script_5:
      name: 场景 5 执行脚本
      default: []
      selector:
        entity:
          domain: script

    scene_option_6:
      name: 场景 6 名称
      default: ""
      selector:
        text: {}
    script_6:
      name: 场景 6 执行脚本
      default: []
      selector:
        entity:
          domain: script
          
    scene_option_7:
      name: 场景 7 名称
      default: ""
      selector:
        text: {}
    script_7:
      name: 场景 7 执行脚本
      default: []
      selector:
        entity:
          domain: script

    scene_option_8:
      name: 场景 8 名称
      default: ""
      selector:
        text: {}
    script_8:
      name: 场景 8 执行脚本
      default: []
      selector:
        entity:
          domain: script

trigger:
  - platform: state
    entity_id: !input select_entity

mode: single

variables:
  # 获取当前选中的状态，并转化为字符串
  current_raw: "{{ trigger.to_state.state | string }}"
  # 获取设置的复位选项
  reset_raw: !input reset_option
  
  # 获取所有输入的场景名称
  opt1: !input scene_option_1
  opt2: !input scene_option_2
  opt3: !input scene_option_3
  opt4: !input scene_option_4
  opt5: !input scene_option_5
  opt6: !input scene_option_6
  opt7: !input scene_option_7
  opt8: !input scene_option_8

action:
  # 1. 安全检查：如果当前选中的是“复位选项”，直接停止（防止死循环）
  # 使用 trim 去除空格进行比对
  - if:
      - condition: template
        value_template: "{{ current_raw | trim == reset_raw | string | trim }}"
    then:
      - stop: "Selected reset option, action ignored."

  # 2. 执行逻辑：逐个比对，找到匹配的选项并执行脚本
  # 逻辑说明：(输入不为空) 且 (当前状态 去除空格 == 输入名称 去除空格)
  - choose:
      - conditions: "{{ opt1 | string | trim != '' and current_raw | trim == opt1 | string | trim }}"
        sequence: 
          - service: script.turn_on
            target: { entity_id: !input script_1 }
            
      - conditions: "{{ opt2 | string | trim != '' and current_raw | trim == opt2 | string | trim }}"
        sequence: 
          - service: script.turn_on
            target: { entity_id: !input script_2 }
            
      - conditions: "{{ opt3 | string | trim != '' and current_raw | trim == opt3 | string | trim }}"
        sequence: 
          - service: script.turn_on
            target: { entity_id: !input script_3 }
            
      - conditions: "{{ opt4 | string | trim != '' and current_raw | trim == opt4 | string | trim }}"
        sequence: 
          - service: script.turn_on
            target: { entity_id: !input script_4 }
            
      - conditions: "{{ opt5 | string | trim != '' and current_raw | trim == opt5 | string | trim }}"
        sequence: 
          - service: script.turn_on
            target: { entity_id: !input script_5 }
            
      - conditions: "{{ opt6 | string | trim != '' and current_raw | trim == opt6 | string | trim }}"
        sequence: 
          - service: script.turn_on
            target: { entity_id: !input script_6 }

      - conditions: "{{ opt7 | string | trim != '' and current_raw | trim == opt7 | string | trim }}"
        sequence: 
          - service: script.turn_on
            target: { entity_id: !input script_7 }

      - conditions: "{{ opt8 | string | trim != '' and current_raw | trim == opt8 | string | trim }}"
        sequence: 
          - service: script.turn_on
            target: { entity_id: !input script_8 }

  # 3. 视觉延迟：让下拉框在当前状态停留一小会儿（0.5秒），给用户操作成功的反馈
  - delay: 
      milliseconds: 500

  # 4. 自动重置：将 input_select 拨回默认位置
  - service: input_select.select_option
    target:
      entity_id: !input select_entity
    data:
      option: "{{ reset_raw | string | trim }}"