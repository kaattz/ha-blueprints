blueprint:
  name: 智能起夜模式
  description: |
    **功能特点：**
    1. **严格时间控制**：仅在可配置时间范围（默认 21:00-07:00）内启动新起夜，已启动流程可在结束后 30 分钟内收尾。
    2. **精准入睡判定**：必须同时满足【人在床上 + 卧室关灯】才进入睡眠模式。
    3. **三段式动线**：床头 -> 通道(客厅) -> 目的地(厨/卫)。
    4. **智能防抖**：内置回床冷却逻辑，防止误触。
    5. **手动唤醒打断**：手动开启卧室灯，自动退出睡眠模式（用于半夜看书/刷手机）。

    ---
    ⚠️ **配置前必读：**

    1. **创建辅助实体**：
       请在【设置 -> 辅助元素】中创建两个 **开关 (Input Boolean)**：
       - **睡眠模式开关** (例如: `input_boolean.sleep_mode`)
       - **起床模式开关** (例如: `input_boolean.get_up_mode`)

    2. **防冲突提醒 (重要)**：
       若厨/卫/客厅已有日常感应自动化，请务必在其 **条件 (Condition)** 中添加：**【起床模式开关】状态为 `关 (Off)`**。
  domain: automation
  input:
    pressure_sensor:
      name: 床铺压力传感器
      description: 'Binary Sensor: on=在床上, off=离床'
      selector:
        entity:
          domain: binary_sensor
    bedroom_status_light:
      name: 卧室灯光状态检测 (核心)
      description: ⚠️ 必须包含卧室所有灯的组(Group)或传感器。
      selector:
        entity:
          domain:
          - light
          - binary_sensor
          - group
    motion_sensor_bedside:
      name: 床边/地脚传感器
      description: 用于检测下床动作。支持 Binary 或 Event。
      selector:
        entity:
          domain:
          - binary_sensor
          - event
    motion_event_keyword:
      name: Event 触发关键词
      description: 仅 Event 实体需要填写，如 '有人移动'。Binary Sensor 忽略此项。
      default: 有人移动
      selector:
        text: {}
    helper_sleep_mode:
      name: 辅助开关：睡眠模式
      description: ⚠️ 选预先创建好的 Input Boolean。
      selector:
        entity:
          domain: input_boolean
    helper_get_up_mode:
      name: 辅助开关：起床模式
      description: ⚠️ 选预先创建好的 Input Boolean。
      selector:
        entity:
          domain: input_boolean
    bedside_lights:
      name: '[床头] 灯光实体'
      description: 起夜时首先点亮的灯光
      selector:
        target:
          entity:
            domain: light
    bedside_brightness:
      name: '[床头] 亮度 (%)'
      default: 2
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    bedside_kelvin:
      name: '[床头] 色温 (K)'
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          unit_of_measurement: K
    bedroom_illuminance_sensor:
      name: '[床头] 照度传感器'
      description: 可选。未配置或状态不可用时使用太阳状态兜底。
      default: []
      selector:
        entity:
          domain: sensor
          device_class: illuminance
          multiple: true
    bedroom_illuminance_threshold:
      name: '[床头] 夜灯照度阈值'
      default: 15
      selector:
        number:
          min: 0
          max: 500
          step: 1
          unit_of_measurement: lx
          mode: box
    path_passage_sensor:
      name: '[通道/客厅] 触发传感器'
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    path_passage_lights:
      name: '[通道/客厅] 灯光实体'
      default: []
      selector:
        target:
          entity:
            domain: light
    path_passage_brightness:
      name: '[通道/客厅] 亮度 (%)'
      default: 3
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    path_passage_kelvin:
      name: '[通道/客厅] 色温 (K)'
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          unit_of_measurement: K
    path_passage_illuminance_sensor:
      name: '[通道/客厅] 照度传感器'
      description: 可选。未配置或状态不可用时使用太阳状态兜底。
      default: []
      selector:
        entity:
          domain: sensor
          device_class: illuminance
          multiple: true
    path_passage_illuminance_threshold:
      name: '[通道/客厅] 夜灯照度阈值'
      default: 15
      selector:
        number:
          min: 0
          max: 500
          step: 1
          unit_of_measurement: lx
          mode: box
    path_a_sensor:
      name: '[终点 A] 触发传感器'
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    path_a_lights:
      name: '[终点 A] 灯光实体'
      default: []
      selector:
        target:
          entity:
            domain: light
    path_a_brightness:
      name: '[终点 A] 亮度 (%)'
      default: 3
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    path_a_kelvin:
      name: '[终点 A] 色温 (K)'
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          unit_of_measurement: K
    path_a_illuminance_sensor:
      name: '[终点 A] 照度传感器'
      description: 可选。未配置或状态不可用时使用太阳状态兜底。
      default: []
      selector:
        entity:
          domain: sensor
          device_class: illuminance
          multiple: true
    path_a_illuminance_threshold:
      name: '[终点 A] 夜灯照度阈值'
      default: 15
      selector:
        number:
          min: 0
          max: 500
          step: 1
          unit_of_measurement: lx
          mode: box
    path_b_sensor:
      name: '[终点 B] 触发传感器'
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    path_b_lights:
      name: '[终点 B] 灯光实体'
      default: []
      selector:
        target:
          entity:
            domain: light
    path_b_brightness:
      name: '[终点 B] 亮度 (%)'
      default: 3
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    path_b_kelvin:
      name: '[终点 B] 色温 (K)'
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          unit_of_measurement: K
    path_b_illuminance_sensor:
      name: '[终点 B] 照度传感器'
      description: 可选。未配置或状态不可用时使用太阳状态兜底。
      default: []
      selector:
        entity:
          domain: sensor
          device_class: illuminance
          multiple: true
    path_b_illuminance_threshold:
      name: '[终点 B] 夜灯照度阈值'
      default: 15
      selector:
        number:
          min: 0
          max: 500
          step: 1
          unit_of_measurement: lx
          mode: box
    lights_to_turn_off:
      name: '[回床] 统一关闭的灯组'
      description: 建议包含所有路径灯光，回床时强制全关。
      selector:
        target:
          entity:
            domain: light
    sleep_start_time:
      name: 自动入睡/起夜开始时间
      description: 可调整，默认 21:00。开始时间与结束时间之间必须留出超过 30 分钟的非起夜区间。
      default: '21:00:00'
      selector:
        time: {}
    sleep_end_time:
      name: 自动入睡/起夜结束时间
      description: 可调整，默认 07:00。强制清理在结束后 30 分钟执行；非整分时间最多延后 59 秒，不会提前。
      default: 07:00:00
      selector:
        time: {}
    cooldown_seconds:
      name: 回床冷却时间 (秒)
      description: 回床后防止误触床边/地脚传感器的冷却时间。
      default: 30
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: seconds
  source_url: https://github.com/kaattz/ha-blueprints/blob/main/%E6%99%BA%E8%83%BD%E8%B5%B7%E5%A4%9C%E6%A8%A1%E5%BC%8F.yaml
mode: queued
max: 10
variables:
  motion_keyword: !input 'motion_event_keyword'
  sleep_mode_entity: !input 'helper_sleep_mode'
  cooldown_sec: !input 'cooldown_seconds'
  sleep_start_text: !input 'sleep_start_time'
  sleep_end_text: !input 'sleep_end_time'
  bedroom_lux_entities: !input 'bedroom_illuminance_sensor'
  bedroom_lux_threshold: !input 'bedroom_illuminance_threshold'
  passage_lux_entities: !input 'path_passage_illuminance_sensor'
  passage_lux_threshold: !input 'path_passage_illuminance_threshold'
  path_a_lux_entities: !input 'path_a_illuminance_sensor'
  path_a_lux_threshold: !input 'path_a_illuminance_threshold'
  path_b_lux_entities: !input 'path_b_illuminance_sensor'
  path_b_lux_threshold: !input 'path_b_illuminance_threshold'
  passage_lights_target: !input 'path_passage_lights'
  path_a_lights_target: !input 'path_a_lights'
  path_b_lights_target: !input 'path_b_lights'
  is_schedule_valid: '{% set start_parts = sleep_start_text.split('':'') %} {% set end_parts = sleep_end_text.split('':'')
    %} {% set start_second = (start_parts[0] | int) * 3600 + (start_parts[1] | int) * 60 + (start_parts[2] | int) %} {% set
    end_second = (end_parts[0] | int) * 3600 + (end_parts[1] | int) * 60 + (end_parts[2] | int) %} {{ ((start_second - end_second)
    % 86400) > 1800 }}'
  is_main_window: |-
    {% set start_parts = sleep_start_text.split(':') %} {% set end_parts = sleep_end_text.split(':') %} {% set start_second = (start_parts[0] | int) * 3600 + (start_parts[1] | int) * 60 + (start_parts[2] | int) %} {% set end_second = (end_parts[0] | int) * 3600 + (end_parts[1] | int) * 60 + (end_parts[2] | int) %} {% set current_second = now().hour * 3600 + now().minute * 60 + now().second %} {% set schedule_valid = ((start_second - end_second) % 86400) > 1800 %} {% if not schedule_valid %}
      false
    {% elif start_second < end_second %}
      {{ start_second <= current_second < end_second }}
    {% elif start_second > end_second %}
      {{ current_second >= start_second or current_second < end_second }}
    {% else %}
      false
    {% endif %}
  is_grace_window: |-
    {% set end_parts = sleep_end_text.split(':') %} {% set end_second = (end_parts[0] | int) * 3600 + (end_parts[1] | int) * 60 + (end_parts[2] | int) %} {% set cleanup_second = (end_second + 1800) % 86400 %} {% set current_second = now().hour * 3600 + now().minute * 60 + now().second %} {% if end_second < cleanup_second %}
      {{ end_second <= current_second < cleanup_second }}
    {% else %}
      {{ current_second >= end_second or current_second < cleanup_second }}
    {% endif %}
  is_bedroom_dark: |-
    {% set readings = namespace(values=[]) %} {% for lux_sensor in expand(bedroom_lux_entities) %}
      {% if is_number(lux_sensor.state) %}
        {% set readings.values = readings.values + [lux_sensor.state | float] %}
      {% endif %}
    {% endfor %} {% if readings.values | count > 0 %}
      {{ (readings.values | max) < (bedroom_lux_threshold | float) }}
    {% else %}
      {{ is_state('sun.sun', 'below_horizon') }}
    {% endif %}
  bedroom_dark_source: |-
    {% set readings = namespace(count=0) %} {% for lux_sensor in expand(bedroom_lux_entities) %}
      {% if is_number(lux_sensor.state) %}{% set readings.count = readings.count + 1 %}{% endif %}
    {% endfor %} {{ 'lux' if readings.count > 0 else 'sun_fallback' if is_state('sun.sun', 'below_horizon') else 'denied' }}
  is_passage_dark: |-
    {% set readings = namespace(values=[]) %} {% for lux_sensor in expand(passage_lux_entities) %}
      {% if is_number(lux_sensor.state) %}
        {% set readings.values = readings.values + [lux_sensor.state | float] %}
      {% endif %}
    {% endfor %} {% if readings.values | count > 0 %}
      {{ (readings.values | max) < (passage_lux_threshold | float) }}
    {% else %}
      {{ is_state('sun.sun', 'below_horizon') }}
    {% endif %}
  passage_dark_source: |-
    {% set readings = namespace(count=0) %} {% for lux_sensor in expand(passage_lux_entities) %}
      {% if is_number(lux_sensor.state) %}{% set readings.count = readings.count + 1 %}{% endif %}
    {% endfor %} {{ 'lux' if readings.count > 0 else 'sun_fallback' if is_state('sun.sun', 'below_horizon') else 'denied' }}
  is_path_a_dark: |-
    {% set readings = namespace(values=[]) %} {% for lux_sensor in expand(path_a_lux_entities) %}
      {% if is_number(lux_sensor.state) %}
        {% set readings.values = readings.values + [lux_sensor.state | float] %}
      {% endif %}
    {% endfor %} {% if readings.values | count > 0 %}
      {{ (readings.values | max) < (path_a_lux_threshold | float) }}
    {% else %}
      {{ is_state('sun.sun', 'below_horizon') }}
    {% endif %}
  path_a_dark_source: |-
    {% set readings = namespace(count=0) %} {% for lux_sensor in expand(path_a_lux_entities) %}
      {% if is_number(lux_sensor.state) %}{% set readings.count = readings.count + 1 %}{% endif %}
    {% endfor %} {{ 'lux' if readings.count > 0 else 'sun_fallback' if is_state('sun.sun', 'below_horizon') else 'denied' }}
  is_path_b_dark: |-
    {% set readings = namespace(values=[]) %} {% for lux_sensor in expand(path_b_lux_entities) %}
      {% if is_number(lux_sensor.state) %}
        {% set readings.values = readings.values + [lux_sensor.state | float] %}
      {% endif %}
    {% endfor %} {% if readings.values | count > 0 %}
      {{ (readings.values | max) < (path_b_lux_threshold | float) }}
    {% else %}
      {{ is_state('sun.sun', 'below_horizon') }}
    {% endif %}
  path_b_dark_source: |-
    {% set readings = namespace(count=0) %} {% for lux_sensor in expand(path_b_lux_entities) %}
      {% if is_number(lux_sensor.state) %}{% set readings.count = readings.count + 1 %}{% endif %}
    {% endfor %} {{ 'lux' if readings.count > 0 else 'sun_fallback' if is_state('sun.sun', 'below_horizon') else 'denied' }}
trigger_variables:
  cleanup_start_text: !input 'sleep_start_time'
  cleanup_end_text: !input 'sleep_end_time'
  cleanup_sleep_mode: !input 'helper_sleep_mode'
  cleanup_get_up_mode: !input 'helper_get_up_mode'
trigger:
- platform: time
  at: !input 'sleep_start_time'
  id: window_start
- platform: state
  entity_id: !input 'pressure_sensor'
  from: 'off'
  to: 'on'
  id: pressure_on
- platform: state
  entity_id: !input 'bedroom_status_light'
  from: 'on'
  to: 'off'
  id: lights_group_off
- platform: state
  entity_id: !input 'bedroom_status_light'
  from: 'off'
  to: 'on'
  id: lights_group_on
- platform: state
  entity_id: !input 'pressure_sensor'
  from: 'on'
  to: 'off'
  id: pressure_off
- platform: state
  entity_id: !input 'motion_sensor_bedside'
  id: motion_bedside
- platform: state
  entity_id: !input 'path_passage_sensor'
  from: 'off'
  to: 'on'
  id: motion_passage
- platform: state
  entity_id: !input 'path_a_sensor'
  from: 'off'
  to: 'on'
  id: motion_path_a
- platform: state
  entity_id: !input 'path_b_sensor'
  from: 'off'
  to: 'on'
  id: motion_path_b
- platform: template
  value_template: |-
    {% set start_parts = cleanup_start_text.split(':') %} {% set end_parts = cleanup_end_text.split(':') %} {% set start_second = (start_parts[0] | int) * 3600 + (start_parts[1] | int) * 60 + (start_parts[2] | int) %} {% set end_second = (end_parts[0] | int) * 3600 + (end_parts[1] | int) * 60 + (end_parts[2] | int) %} {% set cleanup_second = (end_second + 1800) % 86400 %} {% set current_second = now().hour * 3600 + now().minute * 60 + now().second %} {% set schedule_valid = ((start_second - end_second) % 86400) > 1800 %} {% if not schedule_valid %}
      {% set in_main = false %}
    {% elif start_second < end_second %}
      {% set in_main = start_second <= current_second < end_second %}
    {% elif start_second > end_second %}
      {% set in_main = current_second >= start_second or current_second < end_second %}
    {% else %}
      {% set in_main = false %}
    {% endif %} {% if end_second < cleanup_second %}
      {% set in_grace = end_second <= current_second < cleanup_second %}
    {% else %}
      {% set in_grace = current_second >= end_second or current_second < cleanup_second %}
    {% endif %} {% set seconds_overdue = (current_second - cleanup_second) % 86400 %} {% set initial_retry = seconds_overdue < 60 %} {% set periodic_retry = now().minute % 5 == 0 and now().second < 60 %} {{ not in_main and not in_grace
       and (initial_retry or periodic_retry)
       and (is_state(cleanup_sleep_mode, 'on') or is_state(cleanup_get_up_mode, 'on')) }}
  id: cleanup_deadline
- platform: homeassistant
  event: start
  id: ha_start_reconcile
- platform: event
  event_type: automation_reloaded
  id: automation_reload_reconcile
action:
- choose:
  - conditions:
    - condition: or
      conditions:
      - condition: trigger
        id: pressure_on
      - condition: trigger
        id: lights_group_off
      - condition: trigger
        id: window_start
    - condition: template
      value_template: '{{ is_main_window }}'
    - condition: state
      entity_id: !input 'helper_get_up_mode'
      state: 'off'
    - condition: state
      entity_id: !input 'helper_sleep_mode'
      state: 'off'
    - condition: state
      entity_id: !input 'pressure_sensor'
      state: 'on'
    - condition: state
      entity_id: !input 'bedroom_status_light'
      state: 'off'
    sequence:
    - service: input_boolean.turn_on
      target:
        entity_id: !input 'helper_sleep_mode'
    - service: input_boolean.turn_off
      target:
        entity_id: !input 'helper_get_up_mode'
  - conditions:
    - condition: trigger
      id: pressure_on
    - condition: state
      entity_id: !input 'helper_get_up_mode'
      state: 'on'
    sequence:
    - service: light.turn_off
      target: !input 'bedside_lights'
    - if:
      - condition: template
        value_template: '{{ passage_lights_target | length > 0 }}'
      then:
      - service: light.turn_off
        target: !input 'path_passage_lights'
    - if:
      - condition: template
        value_template: '{{ path_a_lights_target | length > 0 }}'
      then:
      - service: light.turn_off
        target: !input 'path_a_lights'
    - if:
      - condition: template
        value_template: '{{ path_b_lights_target | length > 0 }}'
      then:
      - service: light.turn_off
        target: !input 'path_b_lights'
    - service: input_boolean.turn_off
      target:
        entity_id: !input 'helper_get_up_mode'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ is_main_window }}'
        sequence:
        - service: input_boolean.turn_on
          target:
            entity_id: !input 'helper_sleep_mode'
      default:
      - service: input_boolean.turn_off
        target:
          entity_id: !input 'helper_sleep_mode'
  - conditions:
    - condition: trigger
      id: motion_bedside
    - condition: template
      value_template: '{{ is_main_window }}'
    - condition: state
      entity_id: !input 'helper_sleep_mode'
      state: 'on'
    - condition: template
      value_template: "{% set trigger_entity = trigger.entity_id %} {% set domain = trigger_entity.split('.')[0] %} {% if\
        \ domain == 'binary_sensor' %}\n  {{ trigger.to_state.state == 'on' }}\n{% elif domain == 'event' %}\n  {{ trigger.to_state.attributes.event_type\
        \ is defined \n     and trigger.to_state.attributes.event_type == motion_keyword }}\n{% else %}\n  false\n{% endif\
        \ %}\n"
    - condition: template
      value_template: |
        {% if states[sleep_mode_entity] is defined and states[sleep_mode_entity].last_changed %}
          {{ (as_timestamp(now()) - as_timestamp(states[sleep_mode_entity].last_changed)) > (cooldown_sec | int) }}
        {% else %}
          true
        {% endif %}
    - condition: state
      entity_id: !input 'helper_get_up_mode'
      state: 'off'
    sequence:
    - service: input_boolean.turn_on
      target:
        entity_id: !input 'helper_get_up_mode'
    - service: input_boolean.turn_off
      target:
        entity_id: !input 'helper_sleep_mode'
    - if:
      - condition: template
        value_template: '{{ is_bedroom_dark }}'
      then:
      - service: light.turn_on
        target: !input 'bedside_lights'
        data:
          brightness_pct: !input 'bedside_brightness'
          color_temp_kelvin: !input 'bedside_kelvin'
  - conditions:
    - condition: trigger
      id: pressure_off
    - condition: state
      entity_id: !input 'helper_get_up_mode'
      state: 'on'
    sequence: []
  - conditions:
    - condition: trigger
      id: motion_passage
    - condition: template
      value_template: '{{ is_main_window or is_grace_window }}'
    - condition: state
      entity_id: !input 'helper_get_up_mode'
      state: 'on'
    - condition: template
      value_template: '{{ is_passage_dark }}'
    - condition: template
      value_template: '{{ passage_lights_target | length > 0 }}'
    sequence:
    - service: light.turn_on
      target: !input 'path_passage_lights'
      data:
        brightness_pct: !input 'path_passage_brightness'
        color_temp_kelvin: !input 'path_passage_kelvin'
  - conditions:
    - condition: trigger
      id: motion_path_a
    - condition: template
      value_template: '{{ is_main_window or is_grace_window }}'
    - condition: state
      entity_id: !input 'helper_get_up_mode'
      state: 'on'
    - condition: template
      value_template: '{{ is_path_a_dark }}'
    - condition: template
      value_template: '{{ path_a_lights_target | length > 0 }}'
    sequence:
    - service: light.turn_on
      target: !input 'path_a_lights'
      data:
        brightness_pct: !input 'path_a_brightness'
        color_temp_kelvin: !input 'path_a_kelvin'
  - conditions:
    - condition: trigger
      id: motion_path_b
    - condition: template
      value_template: '{{ is_main_window or is_grace_window }}'
    - condition: state
      entity_id: !input 'helper_get_up_mode'
      state: 'on'
    - condition: template
      value_template: '{{ is_path_b_dark }}'
    - condition: template
      value_template: '{{ path_b_lights_target | length > 0 }}'
    sequence:
    - service: light.turn_on
      target: !input 'path_b_lights'
      data:
        brightness_pct: !input 'path_b_brightness'
        color_temp_kelvin: !input 'path_b_kelvin'
  - conditions:
    - condition: trigger
      id: lights_group_on
    - condition: state
      entity_id: !input 'helper_get_up_mode'
      state: 'off'
    - condition: state
      entity_id: !input 'helper_sleep_mode'
      state: 'on'
    sequence:
    - service: input_boolean.turn_off
      target:
        entity_id: !input 'helper_sleep_mode'
  - conditions:
    - condition: or
      conditions:
      - condition: trigger
        id: cleanup_deadline
      - condition: and
        conditions:
        - condition: trigger
          id:
          - ha_start_reconcile
          - automation_reload_reconcile
        - condition: template
          value_template: '{{ not is_main_window and not is_grace_window }}'
        - condition: or
          conditions:
          - condition: state
            entity_id: !input 'helper_sleep_mode'
            state: 'on'
          - condition: state
            entity_id: !input 'helper_get_up_mode'
            state: 'on'
    sequence:
    - choose:
      - conditions:
        - condition: state
          entity_id: !input 'helper_get_up_mode'
          state: 'on'
        sequence:
        - service: light.turn_off
          target: !input 'bedside_lights'
        - if:
          - condition: template
            value_template: '{{ passage_lights_target | length > 0 }}'
          then:
          - service: light.turn_off
            target: !input 'path_passage_lights'
        - if:
          - condition: template
            value_template: '{{ path_a_lights_target | length > 0 }}'
          then:
          - service: light.turn_off
            target: !input 'path_a_lights'
        - if:
          - condition: template
            value_template: '{{ path_b_lights_target | length > 0 }}'
          then:
          - service: light.turn_off
            target: !input 'path_b_lights'
    - service: input_boolean.turn_off
      target:
        entity_id:
        - !input 'helper_sleep_mode'
        - !input 'helper_get_up_mode'
