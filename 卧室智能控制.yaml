blueprint:
  name: 卧室套房智能控制
  description: |
    # 卧室套房智能控制

    **核心功能：**
    * 💡 **进门开灯**：支持自定义亮度与色温。
    * 🌙 **夜灯模式**：睡眠期间门口人体触发、随后开门，只开微弱夜灯；室内人体持续为 ON 也能触发。
    * ⏳ **自动关断**：人走后分级延时关灯、关空调。
    * 🛡️ **误触保护**：结合床压力、卫浴传感器，防止误关灯。

  domain: automation
  source_url: https://github.com/kaattz/ha-blueprints/blob/main/%E5%8D%A7%E5%AE%A4%E6%99%BA%E8%83%BD%E6%8E%A7%E5%88%B6.yaml
  input:
    section_sensors:
      name: 核心传感器与模式
      description: 设置人体感应、床压力以及睡眠模式
      icon: mdi:account-eye
      input:
        inp_bed_presence:
          name: 主卧室人体传感器 (必选)
          selector:
            entity:
              domain:
              - binary_sensor
              device_class:
              - motion
              - occupancy
              - presence
              reorder: false
              multiple: false
        inp_beds:
          name: 床铺压力/存在传感器 (可选)
          description: 只要其中一个为ON，就不打开普通进房灯，也不会因主人体无人而关灯
          default: []
          selector:
            entity:
              multiple: true
              domain:
              - binary_sensor
              reorder: false
        inp_suite_presence:
          name: 套房其他传感器 (可选)
          description: 如卫生间、衣帽间，只要为ON，就不会关灯
          default: []
          selector:
            entity:
              multiple: true
              domain:
              - binary_sensor
              reorder: false
        inp_sleep_modes:
          name: 睡眠模式 (可选)
          description: 任意一个为ON时，视为睡眠中
          default: []
          selector:
            entity:
              multiple: true
              domain:
              - input_boolean
              reorder: false
    section_entry_detection:
      name: 进房判定
      description: 使用可选的门口人体和门磁确认室内人体属于真实进房；条件满足后立即开灯
      icon: mdi:door-open
      input:
        inp_entrance_motion:
          name: 门口人体/红外 (可选)
          default: []
          selector:
            entity:
              domain:
              - binary_sensor
              device_class:
              - motion
              - occupancy
              - presence
              multiple: true
              reorder: false
        inp_door:
          name: 卧室门磁 (可选)
          default: []
          selector:
            entity:
              domain:
              - binary_sensor
              device_class:
              - door
              multiple: true
              reorder: false
        inp_entry_timeout:
          name: 进房信号关联窗口 (秒)
          description: 门口人体、门磁和室内人体在该时间范围内发生，视为同一次进房；条件满足后立即开灯，不等待该时长结束
          default: 10
          selector:
            number:
              min: 1
              max: 60
              mode: slider
              step: 1
    section_entry:
      name: 进房灯光设置
      description: 正常状态下进门的开灯设置
      icon: mdi:lightbulb-auto
      input:
        inp_entry_lights:
          name: 进房开启的灯光
          selector:
            target:
              entity:
              - domain:
                - light
        inp_entry_brightness:
          name: 开启亮度 (%)
          default: 50
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              step: 1
        inp_entry_kelvin:
          name: 开启色温 (K)
          default: 3000
          selector:
            number:
              min: 2000
              max: 6500
              step: 100
              mode: slider
        inp_any_light_on:
          name: 已有灯亮检测 (可选)
          description: 若此实体为ON，进门不执行动作
          default: []
          selector:
            entity:
              multiple: true
              domain:
              - binary_sensor
              reorder: false
        inp_lux:
          name: 光照传感器 (可选)
          default: []
          selector:
            entity:
              domain:
              - sensor
              device_class:
              - illuminance
              multiple: true
              reorder: false
        inp_lux_threshold:
          name: 光照阈值 (lx)
          default: 20
          selector:
            number:
              min: 0
              max: 1000
              mode: box
              step: 1
        inp_enable_sunset:
          name: 日落后强制开灯
          default: false
          selector:
            boolean: {}
    section_night:
      name: 夜灯模式 (确认进房)
      description: 仅在睡眠模式和夜间窗口内有效，使用“进房判定”分组确认真实进房
      icon: mdi:weather-night
      input:
        inp_sleep_entry_mode:
          name: 睡眠进屋双信号夜灯
          description: 选择“开启”后并行处理门口人体和室内人体事件；须配置门口人体、门磁、夜灯目标及已有灯亮检测。原模式保留普通进房和离房行为。
          default: restart
          selector:
            select:
              multiple: false
              custom_value: false
              sort: false
              options:
                - label: 不启用（原模式）
                  value: restart
                - label: 启用双信号夜灯
                  value: parallel

        inp_night_start_time:
          name: 夜灯开始时间
          description: 夜灯分支只在该时间之后生效
          default: '21:00:00'
          selector:
            time: {}
        inp_night_end_time:
          name: 夜灯结束时间
          description: 夜灯分支到该时间停止，支持跨午夜
          default: 07:00:00
          selector:
            time: {}
        inp_night_lights:
          name: 夜灯目标
          default: {}
          selector:
            target:
              entity:
              - domain:
                - light
        inp_night_brightness:
          name: 夜灯亮度 (%)
          default: 2
          selector:
            number:
              min: 1
              max: 100
              mode: slider
              step: 1
        inp_night_kelvin:
          name: 夜灯色温 (K)
          default: 3000
          selector:
            number:
              min: 2000
              max: 6500
              mode: slider
              step: 1
    section_off:
      name: 离房关断逻辑
      description: 无人时的关闭设置
      icon: mdi:power-off
      input:
        inp_off_lights:
          name: 无人时关闭的灯光
          selector:
            target:
              entity:
              - domain:
                - light
        inp_shutdown_devices:
          name: 无人时关闭的其他设备
          default: {}
          selector:
            target:
              entity:
              - domain:
                - media_player
                - switch
                - fan
        inp_light_off_delay:
          name: 关灯延时
          default:
            minutes: 20
          selector:
            duration:
              enable_second: true
        inp_ac:
          name: 空调设备 (可选)
          default: []
          selector:
            entity:
              domain:
              - climate
              multiple: true
              reorder: false
        inp_ac_delay:
          name: 关空调延时
          default:
            minutes: 60
          selector:
            duration:
              enable_second: true
# ========================================================
# 触发器
# ========================================================
trigger_variables:
  sleep_entry_mode: !input inp_sleep_entry_mode

trigger:
  # 人进卧室
  - platform: state
    entity_id: !input inp_bed_presence
    from: "off"
    to: "on"
    id: t_enter

  # 睡眠时第二人进屋：床上有人使室内人体一直为 on，改由门口人体启动。
  - platform: state
    entity_id: !input inp_entrance_motion
    from: "off"
    to: "on"
    id: t_sleep_motion
    enabled: "{{ sleep_entry_mode == 'parallel' }}"

  # 人走超时 (灯)
  - platform: state
    entity_id: !input inp_bed_presence
    from: "on"
    to: "off"
    for: !input inp_light_off_delay
    id: t_lightoff

  # 人走超时 (空调)
  - platform: state
    entity_id: !input inp_bed_presence
    from: "on"
    to: "off"
    for: !input inp_ac_delay
    id: t_ac

# ========================================================
# 动作
# ========================================================
action:
  # 1. 定义变量
  - variables:
      # 实体输入映射
      v_bed_sensor: !input inp_bed_presence
      v_beds: !input inp_beds
      v_suite: !input inp_suite_presence
      v_sleep_modes: !input inp_sleep_modes
      v_any_light: !input inp_any_light_on
      v_lux_list: !input inp_lux
      v_door_list: !input inp_door
      v_motion_outside_list: !input inp_entrance_motion
      v_sleep_entry_mode: !input inp_sleep_entry_mode
      v_night_target: !input inp_night_lights
      v_ac_list: !input inp_ac

      # 数值/开关输入映射
      v_lux_limit: !input inp_lux_threshold
      v_sunset_enable: !input inp_enable_sunset
      v_timeout: !input inp_entry_timeout
      night_start_text: !input inp_night_start_time
      night_end_text: !input inp_night_end_time

      # 床铺和套房占用分别计算：床铺阻止普通进房灯，套房只参与离房保护
      bed_occupied: >
        {{ expand(v_beds) | selectattr('state','eq','on') | list | count > 0 }}

      suite_occupied: >
        {{ expand(v_suite) | selectattr('state','eq','on') | list | count > 0 }}

      occupied_without_main: >
        {{ bed_occupied or suite_occupied }}

      # 逻辑计算：是否有人
      is_occupied: >
        {% set main = is_state(v_bed_sensor, 'on') %}
        {{ main or occupied_without_main }}

      # 逻辑计算：是否睡眠中
      is_sleeping: >
        {{ expand(v_sleep_modes) | selectattr('state','eq','on') | list | count > 0 }}

      # 逻辑计算：灯是否已经亮着
      lights_on: >
        {{ expand(v_any_light) | selectattr('state','eq','on') | list | count > 0 }}

      # 夜灯只在配置的夜间窗口内生效，开始时间晚于结束时间时跨午夜
      is_night_window: >
        {% set current_text = now().strftime('%H:%M:%S') %}
        {% set start_text = night_start_text | string %}
        {% set end_text = night_end_text | string %}
        {% if start_text < end_text %}
          {{ start_text <= current_text < end_text }}
        {% elif start_text > end_text %}
          {{ current_text >= start_text or current_text < end_text }}
        {% else %}
          false
        {% endif %}

  - choose:
      # --------------------------------------------------
      # 场景 1: 真实进房后按可用入口传感器确认，再选择普通灯或夜灯
      # --------------------------------------------------
      - conditions:
          - condition: trigger
            id: t_enter
        sequence:
          # 信号已满足时立即通过，室内人体先触发时最多等待关联窗口。
          - wait_template: >
              {% set has_motion = v_motion_outside_list not in [none, [], ""] %}
              {% set has_door = v_door_list not in [none, [], ""] %}
              {% set motion = namespace(recent=false) %}
              {% set door = namespace(recent=false) %}
              {% for entity in expand(v_motion_outside_list) %}
                {% set age = as_timestamp(now()) - as_timestamp(entity.last_changed) %}
                {% if entity.state not in ['unknown', 'unavailable'] and 0 <= age <= (v_timeout | float) %}
                  {% set motion.recent = true %}
                {% endif %}
              {% endfor %}
              {% for entity in expand(v_door_list) %}
                {% set age = as_timestamp(now()) - as_timestamp(entity.last_changed) %}
                {% if entity.state not in ['unknown', 'unavailable'] and 0 <= age <= (v_timeout | float) %}
                  {% set door.recent = true %}
                {% endif %}
              {% endfor %}
              {% if not is_state(v_bed_sensor, 'on') %}
                true
              {% elif has_motion and has_door %}
                {{ motion.recent and door.recent }}
              {% elif has_motion %}
                {{ motion.recent }}
              {% elif has_door %}
                {{ door.recent }}
              {% else %}
                true
              {% endif %}
            timeout:
              seconds: !input inp_entry_timeout
            continue_on_timeout: false

          # 等待期间室内人体离开则停止，不执行任何开灯分支。
          - condition: state
            entity_id: !input inp_bed_presence
            state: "on"

          - choose:
              # 正常进房开灯：床上有人时不打开普通灯，主卫有人不阻止。
              - conditions:
                  - condition: template
                    value_template: "{{ not is_sleeping }}"
                  - condition: template
                    value_template: "{{ not bed_occupied }}"
                  - condition: template
                    value_template: "{{ not lights_on }}"
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: >
                          {% set lux_s = expand(v_lux_list) | first %}
                          {% if lux_s %}
                            {{ lux_s.state | float(0) < v_lux_limit }}
                          {% else %}
                            true
                          {% endif %}
                      - condition: and
                        conditions:
                          - condition: template
                            value_template: "{{ v_sunset_enable }}"
                          - condition: sun
                            after: sunset
                sequence:
                  - action: light.turn_on
                    target: !input inp_entry_lights
                    data:
                      brightness_pct: !input inp_entry_brightness
                      color_temp_kelvin: !input inp_entry_kelvin

              # 睡眠中保留低亮夜灯；床压允许为 on。
              - conditions:
                  - condition: template
                    value_template: "{{ is_sleeping }}"
                  - condition: template
                    value_template: "{{ is_night_window }}"
                  - condition: template
                    value_template: "{{ v_sleep_entry_mode != 'parallel' }}"
                sequence:
                  - action: light.turn_on
                    target: !input inp_night_lights
                    data:
                      brightness_pct: !input inp_night_brightness
                      color_temp_kelvin: !input inp_night_kelvin

      # --------------------------------------------------
      # 场景 2: 睡眠进屋双信号夜灯（独立于普通进房和离房）
      # --------------------------------------------------
      - conditions:
          - condition: trigger
            id: t_sleep_motion
          - condition: template
            value_template: "{{ v_sleep_entry_mode == 'parallel' }}"
          - condition: template
            value_template: "{{ v_door_list | count > 0 }}"
          - condition: template
            value_template: "{{ v_night_target | length > 0 }}"
          - condition: time
            after: !input inp_night_start_time
            before: !input inp_night_end_time
          - condition: template
            value_template: "{{ expand(v_sleep_modes) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          - condition: template
            value_template: >-
              {% set configured = v_any_light | count %}
              {% set all_states = expand(v_any_light) %}
              {{ configured > 0 and all_states | count == configured
                 and (all_states | selectattr('state', 'eq', 'off') | list | count) == configured }}
        sequence:
          - wait_for_trigger:
              - platform: state
                entity_id: !input inp_door
                from: "off"
                to: "on"
            timeout:
              seconds: !input inp_entry_timeout
            continue_on_timeout: false
          - condition: time
            after: !input inp_night_start_time
            before: !input inp_night_end_time
          # 等待结束后读实时状态；启动时的 is_sleeping/lights_on 已可能过期。
          - condition: template
            value_template: "{{ expand(v_sleep_modes) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          - condition: template
            value_template: >-
              {% set configured = v_any_light | count %}
              {% set all_states = expand(v_any_light) %}
              {{ configured > 0 and all_states | count == configured
                 and (all_states | selectattr('state', 'eq', 'off') | list | count) == configured }}
          - action: light.turn_on
            target: !input inp_night_lights
            data:
              brightness_pct: !input inp_night_brightness
              color_temp_kelvin: !input inp_night_kelvin

      # --------------------------------------------------
      # 场景 3: 延时关灯和设备（不经过进房等待）
      # --------------------------------------------------
      - conditions:
          - condition: trigger
            id: t_lightoff
          - condition: template
            value_template: "{{ not is_occupied }}"
        sequence:
          - condition: state
            entity_id: !input inp_bed_presence
            state: "off"
          - action: light.turn_off
            target: !input inp_off_lights
          - action: homeassistant.turn_off
            target: !input inp_shutdown_devices

      # --------------------------------------------------
      # 场景 4: 延时关空调（不经过进房等待）
      # --------------------------------------------------
      - conditions:
          - condition: trigger
            id: t_ac
          - condition: template
            value_template: "{{ not is_occupied }}"
        sequence:
          - condition: state
            entity_id: !input inp_bed_presence
            state: "off"
          - action: climate.turn_off
            target:
              entity_id: !input inp_ac

mode: !input inp_sleep_entry_mode
max_exceeded: warning
