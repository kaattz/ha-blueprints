blueprint:
  name: 基于时间的电动窗模拟定位控制
  description: >
    专为仅支持“开/关/停”且位置传感器仅在0/100更新的设备设计。
    通过运行时间计算目标位置。
  domain: script
  input:
    motor_select_entity:
      name: 电机控制实体 (Select)
      description: 选择控制电机 开/关/暂停 的 Select 实体。
      selector:
        entity:
          domain: select
    position_sensor_entity:
      name: 位置传感器
      description: 仅在 0 (关) 和 100 (开) 更新状态的传感器。
      selector:
        entity:
          domain: sensor
    travel_time:
      name: 全程运行时间 (秒)
      description: 从完全关闭运行到完全打开所需的秒数 (请用秒表实测)。
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
          mode: box

fields:
  target_position:
    name: 目标位置
    description: 想要到达的百分比 (0-100)
    required: true
    selector:
      number:
        min: 0
        max: 100

sequence:
  - variables:
      # 获取输入变量
      motor: !input motor_select_entity
      sensor: !input position_sensor_entity
      duration: !input travel_time
      # 获取当前状态 (0 或 100)
      current_pos: "{{ states(sensor) | float(0) }}"
      # 获取目标位置 (由调用方传入)
      target: "{{ target_position | float(0) }}"

  - choose:
      # 情况1: 目标全开 (>=98) -> 直接开
      - conditions: "{{ target >= 98 }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ motor }}"
            data:
              option: 打开

      # 情况2: 目标全关 (<=2) -> 直接关
      - conditions: "{{ target <= 2 }}"
        sequence:
          - action: select.select_option
            target:
              entity_id: "{{ motor }}"
            data:
              option: 关闭

    # 情况3: 目标在中间 (需要计算)
    default:
      - choose:
          # A. 当前是关的 (0) -> 往开走
          - conditions: "{{ current_pos <= 2 }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: "{{ motor }}"
                data:
                  option: 打开
              # 计算: 总时间 * 目标百分比
              - delay:
                  seconds: "{{ (duration * target / 100) | round(1) }}"
              - action: select.select_option
                target:
                  entity_id: "{{ motor }}"
                data:
                  option: 暂停

          # B. 当前是开的 (100) -> 往关走
          - conditions: "{{ current_pos >= 98 }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: "{{ motor }}"
                data:
                  option: 关闭
              # 计算: 总时间 * (100 - 目标百分比)
              - delay:
                  seconds: "{{ (duration * (100 - target) / 100) | round(1) }}"
              - action: select.select_option
                target:
                  entity_id: "{{ motor }}"
                data:
                  option: 暂停

        # C. 未知状态 (不在0也不在100) -> 安全复位
        # 错误修复：同上，这里的 default 也没有短横线
        default:
          - action: select.select_option
            target:
              entity_id: "{{ motor }}"
            data:
              option: 关闭
          - delay:
              seconds: "{{ duration + 2 }}"
          - action: select.select_option
            target:
              entity_id: "{{ motor }}"
            data:
              option: 打开
          - delay:
              seconds: "{{ (duration * target / 100) | round(1) }}"
          - action: select.select_option
            target:
              entity_id: "{{ motor }}"
            data:
              option: 暂停