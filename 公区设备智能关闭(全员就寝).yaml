blueprint:
  name: 公区设备智能关闭(全员就寝)
  description: |
    通用逻辑：当检测到“所有在家的人”都“躺在床上”时，且公区无人，自动关闭设备。
    该蓝图适用于家庭成员较多的场景，支持最多4人配置。
    支持防抖动机制：当所有人在床后，等待一段时间（例如3分钟），如果期间有人下床，则取消关闭操作，避免误关。
    仅在配置的允许关闭时间段内执行，默认 20:00 至次日 07:00。
    若确认时间结束后公区仍有人，则继续等待公区恢复无人，但不超过下一个配置的截止时间。

  domain: automation
  source_url: https://github.com/kaattz/ha-blueprints/blob/main/%E5%85%AC%E5%8C%BA%E8%AE%BE%E5%A4%87%E6%99%BA%E8%83%BD%E5%85%B3%E9%97%AD(%E5%85%A8%E5%91%98%E5%B0%B1%E5%AF%9D).yaml

  input:
    section_global:
      name: 全局设置
      icon: mdi:cog
      input:
        wait_time:
          name: 确认延迟 (Wait Time)
          description: 全员在床后，等待多久再执行关灯？(例如 3 分钟)。期间如果有人下床，将取消执行。
          default:
            minutes: 3
          selector:
            duration:
              enable_second: true
        public_area_sensors:
          name: 公区安全检查 (必选)
          description: '只有当这些区域全部无人时，才会执行关闭。

            '
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
                device_class:
                - motion
                - occupancy
                - presence
              reorder: false
        shutdown_window_start:
          name: 允许关闭开始时间
          description: 仅从该时间开始允许执行全员就寝关闭；与截止时间组合后可跨午夜。
          default: "20:00:00"
          selector:
            time: {}
        public_area_wait_deadline:
          name: 允许关闭结束时间（公区等待截止时间）
          description: 到达该时间后不再执行关闭；若公区一直有人，也会在此时取消本轮关闭。
          default: "07:00:00"
          selector:
            time: {}
    section_person_1:
      name: 成员 1 配置
      icon: mdi:account
      collapsed: false
      input:
        p1_tracker:
          name: 人员定位
          default: ''
          selector:
            entity:
              domain:
              - device_tracker
              - person
              reorder: false
              multiple: false
        p1_bed_sensors:
          name: 床铺传感器
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
              reorder: false
    section_person_2:
      name: 成员 2 配置
      icon: mdi:account
      collapsed: false
      input:
        p2_tracker:
          name: 人员定位
          default: ''
          selector:
            entity:
              domain:
              - device_tracker
              - person
              reorder: false
              multiple: false
        p2_bed_sensors:
          name: 床铺传感器
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
              reorder: false
    section_person_3:
      name: 成员 3 配置
      icon: mdi:account
      collapsed: false
      input:
        p3_tracker:
          name: 人员定位
          default: ''
          selector:
            entity:
              domain:
              - device_tracker
              - person
              reorder: false
              multiple: false
        p3_bed_sensors:
          name: 床铺传感器
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
              reorder: false
    section_person_4:
      name: 成员 4 配置
      icon: mdi:account
      collapsed: true
      input:
        p4_tracker:
          name: 人员定位
          default: ''
          selector:
            entity:
              domain:
              - device_tracker
              - person
              reorder: false
              multiple: false
        p4_bed_sensors:
          name: 床铺传感器
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
              reorder: false
    section_actions:
      name: 执行动作
      icon: mdi:flash
      input:
        target_lights:
          name: 关闭灯光
          default: []
          selector:
            target:
              entity:
              - domain:
                - light
        target_medias:
          name: 关闭媒体/电视
          default: []
          selector:
            target:
              entity:
              - domain:
                - media_player
        target_climates:
          name: 关闭空调
          default: []
          selector:
            target:
              entity:
              - domain:
                - climate
# 核心触发逻辑
trigger:
  - platform: template
    value_template: >
      {% set config = [
        {'tracker': inputs.p1_tracker, 'bed': inputs.p1_bed_sensors},
        {'tracker': inputs.p2_tracker, 'bed': inputs.p2_bed_sensors},
        {'tracker': inputs.p3_tracker, 'bed': inputs.p3_bed_sensors},
        {'tracker': inputs.p4_tracker, 'bed': inputs.p4_bed_sensors}
      ] %}
      {% set ns = namespace(all_in_bed=true, someone_home=false) %}
      {% for item in config %}
        {% if item.tracker != none and item.tracker != "" %}
          {% if is_state(item.tracker, 'home') %}
            {% set ns.someone_home = true %}
            {# 只要任意一个床铺传感器 ON 就算在床 #}
            {% set active_bed = expand(item.bed) | selectattr('state', 'eq', 'on') | list | count > 0 %}
            {% if not active_bed %}
              {% set ns.all_in_bed = false %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.someone_home and ns.all_in_bed }}
    id: all_in_bed_true

  # 等待公区无人期间有人下床时，利用 restart 模式立即取消旧执行。
  - platform: template
    value_template: >
      {% set config = [
        {'tracker': inputs.p1_tracker, 'bed': inputs.p1_bed_sensors},
        {'tracker': inputs.p2_tracker, 'bed': inputs.p2_bed_sensors},
        {'tracker': inputs.p3_tracker, 'bed': inputs.p3_bed_sensors},
        {'tracker': inputs.p4_tracker, 'bed': inputs.p4_bed_sensors}
      ] %}
      {% set ns = namespace(all_in_bed=true, someone_home=false) %}
      {% for item in config %}
        {% if item.tracker != none and item.tracker != "" %}
          {% if is_state(item.tracker, 'home') %}
            {% set ns.someone_home = true %}
            {% set active_bed = expand(item.bed) | selectattr('state', 'eq', 'on') | list | count > 0 %}
            {% if not active_bed %}
              {% set ns.all_in_bed = false %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ not (ns.someone_home and ns.all_in_bed) }}
    id: all_in_bed_false

action:
  # 取消触发只负责打断旧执行，不进入关闭流程。
  - condition: trigger
    id: all_in_bed_true

  # 仅允许在配置的时间窗内执行；开始时间晚于结束时间时自动按跨午夜处理。
  - condition: time
    after: !input shutdown_window_start
    before: !input public_area_wait_deadline

  # 将本轮截止时间固定为下一个配置时刻，避免跨午夜计算错误。
  - variables:
      shutdown_deadline_timestamp: >
        {% set cutoff = today_at(inputs.public_area_wait_deadline) %}
        {{ as_timestamp(cutoff if now() < cutoff else cutoff + timedelta(days=1)) }}

  # 1. 全员上床后等待设定的确认时间（例如3分钟）。
  - delay: !input wait_time

  # 2. 等待结束后，再次检查“是否还在床上”
  #    如果这3分钟内有人下床了，这里的 condition 会不满足，从而停止运行。
  - condition: template
    value_template: >
      {% set config = [
        {'tracker': inputs.p1_tracker, 'bed': inputs.p1_bed_sensors},
        {'tracker': inputs.p2_tracker, 'bed': inputs.p2_bed_sensors},
        {'tracker': inputs.p3_tracker, 'bed': inputs.p3_bed_sensors},
        {'tracker': inputs.p4_tracker, 'bed': inputs.p4_bed_sensors}
      ] %}
      {% set ns = namespace(all_in_bed=true, someone_home=false) %}
      {% for item in config %}
        {% if item.tracker != none and item.tracker != "" %}
          {% if is_state(item.tracker, 'home') %}
            {% set ns.someone_home = true %}
            {% set active_bed = expand(item.bed) | selectattr('state', 'eq', 'on') | list | count > 0 %}
            {% if not active_bed %}
              {% set ns.all_in_bed = false %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.someone_home and ns.all_in_bed }}

  # 3. 确认尚未到达本轮截止时间。
  - condition: template
    value_template: >
      {{ as_timestamp(now()) < shutdown_deadline_timestamp | float(0) }}

  # 4. 公区已无人则立即继续，否则等到无人或截止时间。
  #    unknown、unavailable 和不存在的实体均不视为无人。
  - wait_template: >
      {% set sensors = inputs.public_area_sensors %}
      {% if sensors in [none, [], ""] %}
        true
      {% else %}
        {% set ns = namespace(all_clear=true) %}
        {% for sensor in sensors %}
          {% if not is_state(sensor, 'off') %}
            {% set ns.all_clear = false %}
          {% endif %}
        {% endfor %}
        {{ ns.all_clear }}
      {% endif %}
    timeout: >
      {{ [0, shutdown_deadline_timestamp | float(0) - as_timestamp(now())] | max }}
    continue_on_timeout: false

  # 5. 执行前再次确认仍是全员在床。
  - condition: template
    value_template: >
      {% set config = [
        {'tracker': inputs.p1_tracker, 'bed': inputs.p1_bed_sensors},
        {'tracker': inputs.p2_tracker, 'bed': inputs.p2_bed_sensors},
        {'tracker': inputs.p3_tracker, 'bed': inputs.p3_bed_sensors},
        {'tracker': inputs.p4_tracker, 'bed': inputs.p4_bed_sensors}
      ] %}
      {% set ns = namespace(all_in_bed=true, someone_home=false) %}
      {% for item in config %}
        {% if item.tracker != none and item.tracker != "" %}
          {% if is_state(item.tracker, 'home') %}
            {% set ns.someone_home = true %}
            {% set active_bed = expand(item.bed) | selectattr('state', 'eq', 'on') | list | count > 0 %}
            {% if not active_bed %}
              {% set ns.all_in_bed = false %}
            {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.someone_home and ns.all_in_bed }}

  # 6. 再次严格检查公区全部为 off。
  - condition: template
    value_template: >
      {% set sensors = inputs.public_area_sensors %}
      {% if sensors in [none, [], ""] %}
        true
      {% else %}
        {% set ns = namespace(all_clear=true) %}
        {% for sensor in sensors %}
          {% if not is_state(sensor, 'off') %}
            {% set ns.all_clear = false %}
          {% endif %}
        {% endfor %}
        {{ ns.all_clear }}
      {% endif %}

  # 7. 执行关闭
  - choose:
      - conditions: "{{ inputs.target_lights != [] }}"
        sequence:
          - service: light.turn_off
            target: !input target_lights
  - choose:
      - conditions: "{{ inputs.target_medias != [] }}"
        sequence:
          - service: media_player.turn_off
            target: !input target_medias
  - choose:
      - conditions: "{{ inputs.target_climates != [] }}"
        sequence:
          - service: climate.turn_off
            target: !input target_climates

trigger_variables:
  inputs:
    public_area_sensors: !input public_area_sensors
    public_area_wait_deadline: !input public_area_wait_deadline
    target_lights: !input target_lights
    target_medias: !input target_medias
    target_climates: !input target_climates
    p1_tracker: !input p1_tracker
    p1_bed_sensors: !input p1_bed_sensors
    p2_tracker: !input p2_tracker
    p2_bed_sensors: !input p2_bed_sensors
    p3_tracker: !input p3_tracker
    p3_bed_sensors: !input p3_bed_sensors
    p4_tracker: !input p4_tracker
    p4_bed_sensors: !input p4_bed_sensors

mode: restart
